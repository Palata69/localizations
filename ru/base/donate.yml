  - "{dot}<muted>всё, что есть у {rank:legend}"
  - "{dot}<muted>опыт <accent>×1,8</accent>, монеты <accent>×2"
  - "{dot}<muted>цвет префикса <primary>/prefix"
  - "{dot}<muted>статистика других игроков"
  - "{dot}<muted>доступ к подписке {rank:elite}"

donate_description_gui_sponsor: "<b>{rank:sponsor}"
donate_description_gui_sponsor_lore:
  - "<muted>Ваш ник: %prefix%"
  - ""
  - "<muted>Возможности:"
  - "{dot}<muted>всё, что есть у {rank:ultra}"
  - "{dot}<muted>опыт <accent>×2</accent>, монеты <accent>×3"
  - "{dot}<muted>скидка <accent>20%</accent> на покупки за монеты"

