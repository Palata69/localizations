donate_description_gui_title: "<dark>Ранги"

# Ранги: donate_description_gui_<группа> — название, _lore — описание.
# %prefix% — как будет выглядеть ник игрока с этим рангом
donate_description_gui_premium: "<b>{rank:premium}"
donate_description_gui_premium_lore:
  - "<muted>Ваш ник: %prefix%"
  - ""
  - "<muted>Возможности:"
  - "{dot}<muted>опыт <accent>×1,3"
  - "{dot}<muted>цветной суффикс"
  - "{dot}<muted>вход в заполненное лобби"
  - "{dot}<muted>команды <primary>/sit</primary> и <primary>/firework"

donate_description_gui_legend: "<b>{rank:legend}"
donate_description_gui_legend_lore:
  - "<muted>Ваш ник: %prefix%"
  - ""
  - "<muted>Возможности:"
  - "{dot}<muted>всё, что есть у {rank:premium}"
  - "{dot}<muted>опыт <accent>×1,6"

donate_description_gui_ultra: "<b>{rank:ultra}"
donate_description_gui_ultra_lore:
  - "<muted>Ваш ник: %prefix%"
