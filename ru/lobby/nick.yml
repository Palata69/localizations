# Маскировка: смена ника и ранга (/nick)

nick_gui_title: "<dark>Маскировка"

nick_gui_nickname_entry: "<primary>%nick%"
nick_gui_nickname_entry_lore:
  - "<muted>Ник для маскировки"
  - ""
nick_gui_nickname_entry_lore_selected:
  - "<success>Выбран"
nick_gui_nickname_entry_lore_select:
  - "<accent>ЛКМ</accent> <dark>—</dark> <muted>выбрать"

nick_gui_group_entry: "%group%"
nick_gui_group_entry_lore:
  - "<muted>Ранг для маскировки"
  - ""
nick_gui_group_entry_lore_selected:
  - "<success>Выбран"
nick_gui_group_entry_lore_select:
  - "<accent>ЛКМ</accent> <dark>—</dark> <muted>выбрать"
nick_default_group: "{rank:default}"

nick_gui_normal_groups: "<primary>Обычные ранги"
nick_gui_normal_groups_lore:
  - "<muted>Показать ранги игроков"
  - ""
  - "<accent>ЛКМ</accent> <dark>—</dark> <muted>открыть"
nick_gui_special_groups: "<primary>Ранги персонала"
nick_gui_special_groups_lore:
