  - ""
  - "<accent>ЛКМ</accent> <dark>—</dark> <muted>надеть маску"

nick_selected: "{ok}Теперь вы играете как %nick%. Снять маску — <primary>/nick reset"
nick_reset: "{ok}Маска снята"
nick_not_nicked: "{err}Вы не под маской"
nick_already_nicked: "{err}Вы уже под маской. Снять — <primary>/nick reset"
nick_error_no_nicks_found: "{err}Не удалось подобрать свободный ник, попробуйте позже"
nick_error_invalid_name: "{err}Такой ник недопустим"
