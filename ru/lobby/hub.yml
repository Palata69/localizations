  - "<muted>Ранги, облака и бонусы"
  - ""
  - "<accent>ПКМ</accent> <dark>—</dark> <muted>открыть"

queue_join_icon: "<success><b>Встать в очередь"
queue_join_icon_lore:
  - "<muted>Выберите подрежим — вас перенесут"
  - "<muted>в игру, как только найдётся арена"
  - ""
  - "<accent>ПКМ</accent> <dark>—</dark> <muted>выбрать"

queue_leave_icon: "<error><b>Покинуть очередь"
queue_leave_icon_lore:
