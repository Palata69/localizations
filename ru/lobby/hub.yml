hider_icon_lore:
  - "<muted>Скрывает всех, кроме друзей"
  - "<muted>и участников вашей группы"
  - ""
  - "<accent>ПКМ</accent> <dark>—</dark> <muted>переключить"

lobby_players_hidden: "{ok}Игроки скрыты"
lobby_players_shown: "{ok}Игроки снова видны"

# ── Очередь ─────────────────────────────────────────────────────────
queue_vanish_cannot_join: "{err}В невидимости нельзя встать в очередь"
