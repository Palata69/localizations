# Лобби и хаб: вход, хотбар, боссбар, статусы в action bar, NPC и порталы, общие сообщения лобби

# ── Вход в хаб ──────────────────────────────────────────────────────
hub_join_title: "{logo}"
hub_join_subtitle: "<muted>Добро пожаловать"

# Сообщение о входе игрока с рангом (сообщение о входе выбирает сам игрок)
lobby_donate_join_message_format: "{arrow} %player% <muted>%message%"
lobby_donate_join_message_format_elite: "{info}%player% <accent>%message%"

# ── Боссбар ─────────────────────────────────────────────────────────
lobby_bossbar_title: "{logo}"
lobby_bossbar_messages:
  - "<muted>Играйте с друзьями на <primary>{domain}"
  - "<muted>Привилегии и облака — <accent>{store}"
  - "<muted>Новости и общение — <accent>{discord}"
  - "<muted>Заберите ежедневную награду у NPC в лобби"
  - "<muted>Позвать друга в группу — <primary>/party invite <ник>"
  - "<muted>Наш сайт — <accent>{site}"

# ── Action bar: статусы игрока (код склеивает их через запятую) ─────
lobby_nick_active_bar: "<warning>Вы под маской"
lobby_vanish_active_bar: "<info>Вы невидимы"
lobby_booster_active_bar: "<success>Бустер <accent>x%multiplier%</accent> <muted>ещё <accent>%expires%"

# ── Хотбар ──────────────────────────────────────────────────────────
gamemode_select_icon: "<primary><b>Выбор режима"
gamemode_select_icon_lore:
  - "<muted>Все игры сети в одном меню"
  - ""
  - "<accent>ПКМ</accent> <dark>—</dark> <muted>открыть"

lobby_select_icon: "<primary><b>Выбор лобби"
lobby_select_icon_lore:
  - "<muted>Перейти в другое лобби"
  - ""
  - "<accent>ПКМ</accent> <dark>—</dark> <muted>открыть"

server_select_icon: "<primary><b>Выбор подрежима"
server_select_icon_lore:
  - "<muted>Выберите подрежим и карту"
  - ""
  - "<accent>ПКМ</accent> <dark>—</dark> <muted>открыть"

map_select_icon: "<primary><b>Выбор карты"
map_select_icon_lore:
  - "<muted>Сыграть на любимой карте"
  - ""
  - "<accent>ПКМ</accent> <dark>—</dark> <muted>открыть"

shop_icon: "<primary><b>Магазин"
shop_icon_lore:
  - "<muted>Предметы и улучшения режима"
  - ""
  - "<accent>ПКМ</accent> <dark>—</dark> <muted>открыть"

