# ─────────────────────────────────────────────────────────────────────
#  Командный фреймворк: справка, использование, общие ошибки команд.
#  В ключах command_<команда>[_<подкоманда>]_usage — только аргументы:
#  саму команду (/party invite) код подставляет перед ними.
# ─────────────────────────────────────────────────────────────────────

# Префикс сообщений команд (CommandMessageException)
prefix: "{brand}"

# Справка (/команда help) — заголовок и строки
command_help: "<primary>Справка по команде"
command_help_row: "{dot}<primary>%usage%</primary> <dark>—</dark> <muted>%description%"
command_help_no_description: "без описания"

# Использование
command_usage: "{info}Использование: <primary>%usage%"
command_incorrect_usage: "{err}Неверные аргументы команды"

# Условия выполнения
command_unavailable_console: "{err}Эта команда недоступна из консоли"
command_available_only_from_console: "{err}Эта команда доступна только из консоли"
command_unavailable_group: "{err}Команда доступна с ранга %group_name%"
group_available_at_website: "{info}Ранг можно приобрести в магазине <link>{store}"
command_unavailable_cooldown: "{err}Повторить команду можно через <accent>%time%"
command_unavailable: "{err}Эта команда вам недоступна"
no_permission: "{err}У вас нет прав на эту команду"
command_unavailable_on_production: "{err}Команда работает только на тестовом сервере"
command_int_required: "{err}Ожидается число: <accent>%arg%"
command_error: "{err}При выполнении команды произошла ошибка. Сообщите администрации"
command_console_name: "<error>Консоль"

# Названия аргументов для command_int_required
page: "номер страницы"
page_argument: "номер страницы"
idargument: "ID игрока"

