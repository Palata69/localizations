# /guard (прокси): защита от ботов
guard_usage: "{info}Использование: <primary>/guard</primary> <muted>[status | attack on/off/auto | unblock <адрес> | reload]"
guard_status:
  - "{line}"
  - "<primary><b>Защита от ботов</b> <dark>(</dark><accent>%proxy%</accent><dark>)"
  - "{dot}<muted>Защита: %enabled%"
  - "{dot}<muted>Режим атаки: %attack% <dark>(</dark>%mode%<dark>)"
  - "{dot}<muted>Подключений: <accent>%connections%</accent> за <accent>%connections_window%</accent> с <dark>(порог %connections_limit%)"
  - "{dot}<muted>Новых игроков: <accent>%new_players%</accent> за <accent>%new_players_window%</accent> с <dark>(порог %new_players_limit%)"
  - "{dot}<muted>Заблокировано адресов: <accent>%blocked%"
  - "{dot}<muted>Отметка VPN/хостинга: %vpn%"
  - "{line}"
guard_attack_state_active: "<error>включён"
guard_attack_state_inactive: "<success>выключен"
guard_mode_auto: "<muted>автоматически"
guard_mode_forced_on: "<warning>включён вручную"
