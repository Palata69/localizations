core_whois_result_status: "{dot}<success>В сети</success> <muted>на <accent>%server_name%</accent> через <accent>%proxy_name%</accent>, <accent>%online_time%</accent>, версия <accent>%protocol%"
core_whois_result_status_ip: "{dot}<muted>Текущий IP: <accent>%ip%"
core_whois_result_party: "{dot}<muted>Группа <dark>#%id%</dark>: %players% <dark>(открытая: %public%<dark>)"
