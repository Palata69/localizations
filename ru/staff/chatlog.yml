# Журнал чата для модерации (модуль ChatLog): /chatlog и снимки чата к жалобам и наказаниям.
# Видит только персонал (HELPER и выше).

command_chatlog_usage: "<muted><ник> [минуты] <dark>или</dark> <primary>/chatlog evidence <muted><номер>"
chatlog_minutes_field: "минуты"
chatlog_id_field: "номер"

# ── /chatlog <ник> [минуты] ─────────────────────────────────────
chatlog_header:
  - "{line}"
  - "<primary><b>Чат</b></primary> <accent>%player%</accent> <dark>—</dark> <muted>за <accent>%minutes%</accent> мин, сообщений: <accent>%count%"
chatlog_footer: "{line}"
chatlog_row: "<dark>%time%</dark> %channel% <muted>%server%</muted> <dark>»</dark> <text>%message%</text>%filtered%"
chatlog_channel_public: "<muted>[чат]"
chatlog_channel_private: "<info>[ЛС {arrow} %target%]"
chatlog_channel_party: "<primary>[группа]"
chatlog_channel_staff: "<warning>[персонал]"
chatlog_filtered: " <error>[не доставлено или изменено фильтром]"
chatlog_empty: "{info}У <accent>%player%</accent> нет сообщений за <accent>%minutes%</accent> мин"
chatlog_disabled: "{err}Журнал чата выключен: нет связи с ClickHouse"
chatlog_error: "{err}Не удалось получить журнал чата, попробуйте позже"

# ── Снимки чата (доказательства) ────────────────────────────────
chatlog_evidence_saved: "{staff}{info}Сохранён чат <accent>%player%</accent> <dark>(</dark><muted>%kind%, сообщений: <accent>%count%</accent></muted><dark>)</dark> "
chatlog_evidence_button: "<link>[показать]"
chatlog_evidence_button_hover: "<muted>Сообщения игрока на момент жалобы или наказания"
chatlog_evidence_header:
  - "{line}"
  - "<primary><b>Снимок чата</b></primary> <dark>#%id%</dark> <dark>—</dark> <muted>%kind%</muted> <accent>%player%"
  - "<muted>Сохранён <accent>%date%</accent>, сообщений: <accent>%count%"
chatlog_evidence_not_found: "{err}Снимок чата <accent>%ref%</accent> не найден"
chatlog_evidence_usage: "{info}Использование: <primary>/chatlog evidence <muted><номер></muted></primary> <dark>или</dark> <primary>/chatlog evidence ban <muted><номер></muted></primary> <dark>(</dark><primary>mute</primary><dark>)"
chatlog_kind_report: "жалоба"
chatlog_kind_ban: "бан"
chatlog_kind_mute: "мут"
chatlog_kind_kick: "кик"
