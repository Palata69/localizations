# Род в имени ключа — просто часть имени; прилагательное согласуется по роду из заголовка «:СЛОВО:РОД» в words.txt.
# С числом: «1 монета» — им. ед., «2 монеты» — род. ед., «5 монет» — род. мн.
# Прилагательное: adjective_<слово>_<падеж>_<masculine|feminine|neuter|plural>.
