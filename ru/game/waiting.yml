# Мини-игры: ожидание и старт игры

game_player_join: "<accent>%name%</accent> зашёл в игру <dark>(</dark><accent>%online%</accent><dark>/</dark><accent>%slots%</accent><dark>)"
game_player_quit: "<accent>%name%</accent> вышел из игры <dark>(</dark><accent>%online%</accent><dark>/</dark><accent>%slots%</accent><dark>)"
waiting_not_enough_players: "{warn}Не хватает игроков, отсчёт остановлен"
game_force_started: "{ok}Вы запустили игру досрочно"

game_start_timer_message: "{info}Игра начнётся через <accent>%time%"
# Тайтлы обратного отсчёта: на 10 секундах и на последних 5
game_start_countdown_title: "<success><b>%seconds%"
game_start_countdown_final_title: "<error><b>%seconds%"

# Ошибка при запуске игры
game_start_error_screenshot: "{warn}Сделайте снимок экрана с сообщениями ниже и отправьте его администрации"
game_start_error: "{err}Ошибка <accent>%error%</accent> при запуске игры: <error>%message%"

# Табло ожидания и наблюдателя
board_mode: "<muted>Режим: <accent>%mode%"
board_players: "<muted>Игроки: <accent>%players%"
board_waiting: "<muted>Ожидание игроков"
board_until_start: "<muted>Старт через <accent>%time%"
board_spectator_display_name: "<primary><b>Наблюдение"
board_spectator_spectators: "<muted>Наблюдатели: <accent>%spectators%"
