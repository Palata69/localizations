citadel_draft_lineup_title: "{info}Составы команд:"
citadel_draft_lineup_team: "  %team%: %heroes%"
citadel_draft_gui_title: "Баны и пики"
citadel_draft_gui_role: "<muted>Роль:</muted> %role%"
citadel_draft_gui_click: "<accent>Нажмите, чтобы выбрать"
citadel_draft_gui_click_ban: "<error>Нажмите, чтобы забанить"
citadel_draft_gui_free: "<muted>Свободен"
citadel_draft_gui_banned: "<error>Забанен"
citadel_draft_gui_picked: "<muted>Выбран:</muted> %team%"

# Планирование: раздача героев команды и стартовый закуп
citadel_planning_started: "{info}Время планирования: <accent>%seconds% с</accent>. Возьмите героя из выбранных капитаном (ПКМ) и закупитесь в магазине (<accent>F</accent>)"
citadel_planning_actionbar: "<muted>Планирование</muted> <dark>•</dark> <accent>%seconds% с"
citadel_planning_gui_title: "Герои команды"
citadel_planning_gui_click: "<accent>Нажмите, чтобы взять"
citadel_planning_gui_yours: "<success>Ваш герой"
citadel_planning_gui_taken: "<muted>Берёт</muted> <accent>%player%"
citadel_planning_claimed: "{ok}Вы берёте %hero%"
citadel_planning_taken: "{err}Этого героя уже взял <accent>%player%"
citadel_planning_result: "{info}Вы играете за %hero%"

# Матч
citadel_match_starting: "{ok}Герои выбраны — матч начинается!"
citadel_hud: "<error>❤ %hp%</error><muted>/%max_hp%</muted> <dark>•</dark> <accent>✦ %mana%</accent><muted>/%max_mana%</muted> <dark>•</dark> <warning>⛃ %gold%"
citadel_ability_slot: "Способность %slot%"
citadel_cast_no_ability: "{err}Здесь нет способности"
citadel_cast_silenced: "{err}Сейчас нельзя применять способности"
citadel_cast_locked: "{err}Ультимейт открывается с <accent>%level%</accent> уровня"
