citadel_cast_no_mana: "{err}Не хватает маны"
citadel_cast_no_target: "{err}Нет цели в прицеле"
citadel_cast_failed: "{err}Не удалось применить способность"
citadel_hero_killed: "{info}<accent>%killer%</accent> убивает <accent>%victim%"
citadel_hero_died: "{info}<accent>%victim%</accent> погибает"


