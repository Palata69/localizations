# Режим «Цитадель» (MOBA 3v3), модуль games/citadel. Все ключи — с префиксом citadel_

# Админская команда /citadel
citadel_command_usage:
  - "{info}Команды «Цитадели»:"
  - "<accent>/citadel setup</accent> <muted>— разметка карты"
  - "<accent>/citadel captain</accent> <muted>— стать капитаном команды"

# Разметка карты: /citadel setup ...
citadel_setup_usage:
  - "{info}Разметка карты (точка берётся по вашему положению):"
  - "<accent>/citadel setup spawn</accent> <A|B> \\<1-3> <muted>— точка спавна"
  - "<accent>/citadel setup shop</accent> <A|B> <muted>— магазин"
  - "<accent>/citadel setup tower</accent> <A|B> <outer|inner> [ширина высота глубина] <muted>— башня"
  - "<accent>/citadel setup core</accent> <A|B> [ширина высота глубина] <muted>— ядро"
  - "<accent>/citadel setup lane</accent> <add|undo|clear> <muted>— маршрут крипов от базы A к базе B"
  - "<accent>/citadel setup show</accent> <muted>— показать точки, <accent>status</accent> <muted>— чего не хватает"
  - "<accent>/citadel setup save</accent> <muted>— проверить и сохранить config.yml карты"

